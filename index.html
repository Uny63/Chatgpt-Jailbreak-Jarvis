
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS | Control System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --white: #ffffff;
    --black: #000000;
    --gray: #888888;
    --panel: #080808;
}

body {
    min-height: 100vh;
    padding: 30px 15px;
    background: var(--black);
    color: var(--white);
    font-family: "Segoe UI", Arial, sans-serif;
}

.container {
    max-width: 1050px;
    margin: auto;
    padding: 30px;
    background: var(--panel);
    border: 1px solid white;
    border-radius: 20px;
    box-shadow:
        0 0 12px #ffffff55,
        0 0 35px #ffffff18,
        inset 0 0 25px #ffffff08;
    overflow: hidden;
}

.header {
    text-align: center;
    padding: 25px 10px;
}

.logo {
    font-size: 43px;
    font-weight: 800;
    letter-spacing: 12px;
    text-shadow: 0 0 12px white, 0 0 30px #aaa;
}

.subtitle {
    color: #999;
    font-size: 11px;
    letter-spacing: 5px;
    margin-top: 12px;
}

.line {
    height: 1px;
    background: white;
    opacity: .5;
    margin: 20px 0;
    box-shadow: 0 0 10px white;
}

.system-info {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    color: #aaa;
    font-size: 10px;
    letter-spacing: 2px;
}

.languages {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 30px auto;
    flex-wrap: wrap;
}

button {
    min-width: 180px;
    padding: 16px 25px;
    background: black;
    color: white;
    border: 1px solid white;
    border-radius: 9px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    transition: .25s ease;
    box-shadow: 0 0 9px #ffffff35;
}

button:hover {
    background: white;
    color: black;
    box-shadow:
        0 0 12px white,
        0 0 28px white,
        0 0 45px #ffffff55;
    transform: translateY(-3px);
}

button:active {
    transform: scale(.96);
}

button.active {
    background: white;
    color: black;
    box-shadow: 0 0 15px white, 0 0 30px #ffffff88;
}

.panel {
    display: none;
    margin-top: 25px;
    padding: 25px;
    border: 1px solid #888;
    border-radius: 15px;
    background: #030303;
    box-shadow: inset 0 0 20px #ffffff08;
}

.panel.visible {
    display: block;
    animation: appear .4s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.panel h2 {
    text-align: center;
    font-size: 20px;
    letter-spacing: 4px;
    margin-bottom: 25px;
    text-shadow: 0 0 10px white;
}

.copy-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 20px 0;
    color: #ddd;
    font-size: 11px;
    letter-spacing: 2px;
}

.copy-btn {
    min-width: 145px;
    padding: 12px;
    font-size: 10px;
    letter-spacing: 1px;
}

textarea {
    display: block;
    width: 100%;
    min-height: 650px;
    resize: vertical;
    padding: 22px;
    background: #000;
    color: #eee;
    border: 1px solid #666;
    border-radius: 10px;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
    outline: none;
    box-shadow: inset 0 0 15px #ffffff0c;
}

textarea:focus {
    border-color: white;
    box-shadow: 0 0 15px #ffffff55;
}

.status {
    margin-top: 25px;
    padding: 15px;
    text-align: center;
    border: 1px solid #555;
    border-radius: 8px;
    color: white;
    font-size: 11px;
    letter-spacing: 3px;
    box-shadow: 0 0 10px #ffffff15;
}

.status.success {
    border-color: white;
    box-shadow: 0 0 15px #ffffff55;
}

footer {
    margin-top: 30px;
    text-align: center;
    color: #666;
    font-size: 10px;
    letter-spacing: 4px;
}

@media(max-width: 600px) {
    .container {
        padding: 15px;
    }

    .logo {
        font-size: 29px;
        letter-spacing: 7px;
    }

    .languages {
        flex-direction: column;
    }

    .languages button {
        width: 100%;
    }

    .panel {
        padding: 12px;
    }

    .copy-row {
        flex-wrap: wrap;
    }

    textarea {
        min-height: 500px;
        font-size: 11px;
    }
}
</style>
</head>

            <button class="copy-btn" onclick="copyText('esText')">
                COPIAR TEXTO
            </button>
        </div>

        <textarea id="esText" readonly spellcheck="false"></textarea>

        <div class="copy-row">

            <button class="copy-btn" onclick="copyText('esText')">

</div>

document.getElementById("esText").value = spanishText;

// ==================================
// LANGUAGE SELECTOR
// ==================================

function showLanguage(language) {

    const spanish = document.getElementById("spanish");
    const english = document.getElementById("english");

    spanish.classList.toggle("visible", language === "es");
    english.classList.toggle("visible", language === "en");

    document.getElementById("esBtn").classList.toggle(
        "active", language === "es"
    );

    document.getElementById("enBtn").classList.toggle(
        "active", language === "en"
    );

    setStatus(
        language === "es"
            ? "IDIOMA SELECCIONADO: ESPAÑOL"
            : "SELECTED LANGUAGE: ENGLISH"
    );
}

// ==================================
// COPY FUNCTION
// ==================================

async function copyText(id) {

    const textarea = document.getElementById(id);

    try {

        await navigator.clipboard.writeText(textarea.value);

        setStatus(
            id === "esText"
                ? "CONFIGURACIÓN ESPAÑOLA COPIADA"
                : "ENGLISH CONFIGURATION COPIED",
            true
        );

    } catch (error) {

        textarea.focus();
        textarea.select();

        const copied = document.execCommand("copy");

        if (copied) {
            setStatus("TEXT COPIED SUCCESSFULLY", true);
        } else {
            setStatus("COPY FAILED - SELECT TEXT MANUALLY");
        }
    }
}

// ==================================
// STATUS DISPLAY
// ==================================

function setStatus(message, success = false) {

    const status = document.getElementById("status");

    status.textContent = message;

    status.classList.toggle("success", success);
}

// ==================================
// DEFAULT SCREEN
// ==================================
